name: Quality Gates

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Windows Release Verification
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm run audit:dependencies

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and component tests
        run: npm run test

      - name: Performance benchmark
        run: npm run benchmark:performance

      - name: Build and validate extension
        run: npm run build:extension

      - name: Verify installed Chrome and Edge
        run: npm run check:browsers

      - name: Verify installed Chrome data safety
        run: npm run check:browser-data-safety

      - name: End-to-end tests
        run: npm run test:e2e

      - name: Package release archive
        run: npm run package:release
